# pytest.ini
[pytest]
# Регистрация кастомных меток (Требование 6)
markers =
    smoke: Быстрые тесты основной функциональности
    regression: Полные регрессионные тесты
    critical: Критически важные тесты
    cookies: Тесты работы с куками
    screenshots: Тесты со скриншотами

# Настройки вывода
addopts = 
    -v
    --tb=short

# Игнорировать предупреждения о неизвестных маркерах (альтернатива регистрации)
# filterwarnings =
#     ignore::pytest.PytestUnknownMarkWarning